[project]
name = "tearsheet"
dynamic = ["version"]
description = "Unofficial local MCP server for researching Indian stocks with your own Tijori Finance account and your own filings"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "edbn" }]
keywords = ["mcp", "model-context-protocol", "stocks", "india", "research"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "defusedxml>=0.7",
    "mcp>=2.3,<3",
    "playwright>=1.64",
    "pydantic>=2.11",
    "pypdf>=5",
]

[project.scripts]
tearsheet = "tearsheet.cli:main"

[project.urls]
Repository = "https://github.com/kewonit/tearsheet"
Issues = "https://github.com/kewonit/tearsheet/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tearsheet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tearsheet"]

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not live'"
markers = [
    "browser: needs Playwright's Chromium, run with: pytest -m browser",
    "live: contacts Tijori, so never runs in CI, run with: pytest -m live",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
