# Analyst tasks for measuring tearsheet with a real agent.
#
# Checks use only public identifiers and behaviour, never Tijori's figures, so
# no Tijori data is stored here. Tune tool descriptions against the "tuning"
# split only, and use "held_out" to check that changes generalise.
#
# Check fields:
#   first_tool        the first tearsheet tool the agent should call
#   tools_include     tearsheet tools the agent must call
#   contains          text the answer must contain, ignoring case
#   contains_any      at least one of these must appear, ignoring case
#   max_tool_calls    a budget for tearsheet tool calls

[[task]]
id = "t-id-01"
split = "tuning"
prompt = "What are the NSE symbol and BSE code of Pix Transmissions?"
first_tool = "find_company"
contains = ["PIXTRANS", "500333"]
max_tool_calls = 2

[[task]]
id = "t-id-02"
split = "tuning"
prompt = "Look up NGLFINECHEM and give me its identifiers."
first_tool = "find_company"
contains = ["NGLFINE", "524774"]
max_tool_calls = 2

[[task]]
id = "t-fin-01"
split = "tuning"
prompt = "What were NGL Fine-Chem's consolidated sales in its last three income statement periods? Say which ones are full financial years."
tools_include = ["get_financials"]
contains = ["TTM"]
max_tool_calls = 3

[[task]]
id = "t-fin-02"
